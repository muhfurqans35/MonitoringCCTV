listener 1883
protocol mqtt

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Untuk development: allow anonymous. Untuk production, set false
# dan buat password file dengan `mosquitto_passwd`.
allow_anonymous true

# Jika ingin autentikasi, aktifkan baris berikut dan buat file password_file:
# allow_anonymous false
# password_file /mosquitto/config/passwd
