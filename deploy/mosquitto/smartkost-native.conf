# Mosquitto native di Raspberry Pi: salin ke /etc/mosquitto/conf.d/smartkost.conf
# (mosquitto.conf bawaan Debian sudah meng-include conf.d). Lihat docs/SECURITY.md bagian MQTT.
#
# Tanpa ini broker menerima SIAPA PUN di WiFi kost: bisa mengirim telemetri/alert palsu,
# membuka bel pintu, atau membaca semua event kamera.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/smartkost.passwd
acl_file /etc/mosquitto/smartkost.acl

# Layanan di Pi (ingest, vision, doorbell, alertengine) + node ESP32 di LAN.
listener 1883 0.0.0.0
