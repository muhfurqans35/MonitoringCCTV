# Config nginx native (bukan container) untuk Raspberry Pi.
# Taruh file ini di /etc/nginx/sites-available/smartkost, lalu:
#   sudo ln -s /etc/nginx/sites-available/smartkost /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # matikan default page nginx
#   sudo nginx -t && sudo systemctl reload nginx
#
# Keamanan (lihat docs/SECURITY.md):
#   * api hanya mendengar 127.0.0.1:8080 -> semua akses lewat nginx ini.
#   * /live/ (go2rtc) hanya untuk sesi pemilik (auth_request) dan hanya path pemutar video;
#     API konfigurasi go2rtc (tambah/ubah stream) TIDAK bisa diakses dari browser.
#   * Login dibatasi 10 percobaan/menit per IP (api juga punya pembatas sendiri).

# Batas laju (file ini di-include di dalam blok http{}, jadi zona boleh didefinisikan di sini).
limit_req_zone $binary_remote_addr zone=sk_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sk_api:10m rate=20r/s;

# HTTPS menurut proxy depan (Cloudflare Tunnel mengirim X-Forwarded-Proto: https).
map $http_x_forwarded_proto $sk_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $sk_proto $sk_hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # IP asli pengunjung bila lewat cloudflared (yang tersambung dari localhost).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    root /home/supriadi/Dev/smartkost/frontend;
    index index.html;

    # ---- header keamanan untuk semua respons ----
    # 'unsafe-inline' pada script dibutuhkan loader wasm yang disisipkan trunk ke index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security $sk_hsts always;

    # File tersembunyi (.env, .git, dst.) tidak pernah dilayani.
    location ~ /\. { return 404; }

    # ---- login: dibatasi lajunya ----
    location = /api/auth/login {
        limit_req zone=sk_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/smartkost-proxy.conf;
    }

    # ---- REST API ----
    location /api/ {
        limit_req zone=sk_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/smartkost-proxy.conf;
    }

    # Playback NVR: mengambil klip dari NVR butuh waktu (±separuh durasi klip).
    location /api/nvr/ {
        limit_req zone=sk_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/smartkost-proxy.conf;
        limit_req_status 429;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- WebSocket data kamar (api memeriksa cookie sesi + Origin) ----
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/smartkost-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # ---- Live CCTV (go2rtc): hanya pemilik yang login, hanya file pemutar + WebSocket video ----
    location = /_auth_owner {
        internal;
        proxy_pass http://127.0.0.1:8080/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
    location ~ ^/live/(stream\.html|video-rtc\.js|video-stream\.js|api/ws)$ {
        auth_request /_auth_owner;
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:1984;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
    # Sisa API go2rtc (/api/streams, /api/config, ...) ditutup.
    location /live/ { return 404; }

    # ---- frontend (SPA fallback ke index.html) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
    # index.html jangan di-cache (nama file wasm/js berubah tiap build).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security $sk_hsts always;
    }
}
