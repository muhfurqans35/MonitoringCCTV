# Header standar ke api. Salin ke /etc/nginx/smartkost-proxy.conf (dipakai smartkost.conf).
# $http_host (bukan $host) agar port ikut: api membandingkan Origin dengan Host.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $sk_proto;
proxy_set_header X-Forwarded-For "";
