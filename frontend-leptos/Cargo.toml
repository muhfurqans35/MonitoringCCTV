[package]
name = "frontend-leptos"
edition = "2021"
version = "0.1.0"

[workspace]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "console", "Blob", "BlobPropertyBag", "Url", "HtmlVideoElement", "HtmlMediaElement", "Element", "HtmlElement", "DomRect", "MouseEvent", "EventTarget"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.5", features = ["websocket"] }
gloo-storage = "0.3"
futures = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
